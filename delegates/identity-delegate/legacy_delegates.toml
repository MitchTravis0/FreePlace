# Append-only registry of every previous identity-delegate WASM build.
# A delegate WASM change re-keys the delegate (key = blake3(blake3(wasm) || params))
# and strands secrets stored under the old key, so the outgoing hash MUST be
# recorded here before the new WASM ships. freenet-migrate-build validates the
# key derivation at build time and emits the lineage consts in common::legacy.

